name: Garder Supabase actif

# Le plan gratuit Supabase met en pause un projet jugé inactif depuis 7 jours.
# 2026-11-24 : une simple lecture d'une ligne tous les 3 jours n'a PAS suffi (projet mis en pause
# malgré des pings réussis les 16, 19 et 22/11). Désormais, chaque jour :
#   1. une lecture REST (1 ligne) ;
#   2. un appel à la fonction serveur lire-agenda, qui lit un agenda et ÉCRIT en base
#      (agenda_liens.derniere_lecture / cache) : vraie activité base + fonction, comme un usage réel.
# Gratuit (repo public = minutes GitHub Actions illimitées), aucun secret nécessaire (la clé "anon"
# est publique par design, voir js/supabase-client.js). L'adresse d'agenda reste côté serveur.
on:
  schedule:
    - cron: '17 21 * * *'   # chaque jour à 21h17 UTC (8h17 en Nouvelle-Calédonie)
  workflow_dispatch:         # bouton "Run workflow" manuel dans l'onglet Actions, si besoin

env:
  SUPABASE_URL: https://kgklcrxecietxbkvwrnw.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtna2xjcnhlY2lldHhia3Z3cm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTcxNDUsImV4cCI6MjEwMzY5MzE0NX0.YCieusV14yUf4WdkTvihdzZ0XkTWGjf3r5LXI9Ht2lY

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture REST
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/ecoles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
      - name: Appel de la fonction lire-agenda (écriture en base)
        run: |
          # On ne garde que le code HTTP : la réponse (évènements d'agenda) n'est jamais affichée.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/lire-agenda" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{"intervenantId":"vincent"}' --max-time 90)
          echo "lire-agenda : HTTP $code"
          [ "$code" = "200" ]
